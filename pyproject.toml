[project]
name = "mini-agent-web"
version = "0.1.0"
description = "Web interface and Python SDK for Mini Agent Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mini-agent",
]

[tool.uv.sources]
mini-agent = { path = "sdk/python", editable = true }

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]
tui = [
    "rich>=13.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false
