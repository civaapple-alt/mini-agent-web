[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-agent"
version = "0.1.0"
description = "Official Python SDK for Mini Agent App Server and Harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mini Agent Team" }]
keywords = ["mini-agent", "agent", "ai", "coding-agent", "jsonrpc", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/civaapple-alt/mini-agent-harness"
Repository = "https://github.com/civaapple-alt/mini-agent-harness"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]
