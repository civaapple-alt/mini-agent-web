[project]
name = "mini-agent-web"
version = "0.5.0"
description = "Web interface, Cookbook, and Python SDK Workspace for Mini Agent Harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mini Agent Team" }]
keywords = ["mini-agent", "ai-agents", "llm-harness", "jsonrpc", "python-sdk"]
dependencies = [
    "mini-agent",
]

[project.urls]
Homepage = "https://github.com/civaapple-alt/mini-agent-web"
Repository = "https://github.com/civaapple-alt/mini-agent-web"
Issues = "https://github.com/civaapple-alt/mini-agent-web/issues"
Documentation = "https://github.com/civaapple-alt/mini-agent-web/tree/main/docs"
Harness = "https://github.com/civaapple-alt/mini-agent-harness"

[project.scripts]
mini-agent-server = "server.main:run_server"
mini-agent-server-dev = "server.main:run_server_dev"
mini-agent-tui = "tui.tui_app:main"
mini-agent-web = "server.main:run_server"

[tool.uv.sources]
mini-agent = { workspace = true }

[tool.uv.workspace]
members = ["sdk/python"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]
tui = [
    "rich>=13.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
